name: Deploy DocC Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docs/HandJutsu.docc/**"
      - ".github/workflows/deploy-docc-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build DocC site
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build DocC archive for static hosting
        run: |
          DOCC="/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/docc"
          OUTPUT_PATH="$RUNNER_TEMP/HandJutsuDocC"

          "$DOCC" convert docs/HandJutsu.docc \
            --fallback-display-name "Hand Jutsu" \
            --fallback-bundle-identifier "com.siu.HandJutsu.docs" \
            --fallback-bundle-version "1" \
            --hosting-base-path "/${{ github.event.repository.name }}" \
            --warnings-as-errors \
            --output-path "$OUTPUT_PATH"

          touch "$OUTPUT_PATH/.nojekyll"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/HandJutsuDocC

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
