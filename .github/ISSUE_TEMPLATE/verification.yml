name: "검증 및 오류 보고"
description: "컴파일, DocC, Simulator, 실기기, API 정확성 또는 배포 문제를 기록합니다."
title: "[Verify] "
body:
  - type: dropdown
    id: category
    attributes:
      label: 검증 영역
      options:
        - "Swift / Xcode 컴파일"
        - "DocC 빌드 및 링크"
        - "visionOS Simulator"
        - "Apple Vision Pro 실기기"
        - "ARKit / RealityKit API 정확성"
        - "GitHub Actions / GitHub Pages"
        - "튜토리얼 설명과 코드의 불일치"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 검증 환경
      description: 재현 가능한 수준으로 버전과 실행 환경을 적어 주세요.
      placeholder: |
        - macOS:
        - Xcode:
        - visionOS SDK:
        - 실행 대상: Simulator / Apple Vision Pro
        - 문서 URL 또는 커밋:
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 또는 확인 절차
      placeholder: |
        1. 앱에서 술법 공간을 연다.
        2. 양손을 펼쳐 서로 마주 보게 한다.
        3. 효과의 위치를 확인한다.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
      description: 오류 전문, 화면 녹화, 스크린샷 또는 로그를 첨부해도 좋습니다. 개인정보나 비밀 값은 제거하세요.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 근거와 관련 링크
      description: 관련 Issue/PR, Apple 공식 문서, 실패 로그 위치를 연결해 주세요.

  - type: dropdown
    id: impact
    attributes:
      label: 영향도
      options:
        - "진행 불가: 빌드 또는 핵심 흐름이 동작하지 않음"
        - "높음: 학습자가 잘못된 결과를 얻게 됨"
        - "보통: 우회 가능하지만 수정이 필요함"
        - "낮음: 표현, 오탈자 또는 작은 개선"
    validations:
      required: true

  - type: checkboxes
    id: verification
    attributes:
      label: 보고 전 확인
      options:
        - label: 현재 기본 브랜치 또는 명시한 커밋에서 다시 확인했습니다.
          required: true
        - label: 추정과 직접 관찰한 결과를 구분해 작성했습니다.
          required: true
