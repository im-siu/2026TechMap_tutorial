name: "튜토리얼 작업"
description: "새 튜토리얼 장, 예제 코드, 공간 효과 또는 배포 작업을 제안합니다."
title: "[Tutorial] "
body:
  - type: markdown
    attributes:
      value: |
        이 Issue는 작업자와 AI가 함께 읽는 작업 명세입니다.
        구현 전에 목표, 범위, 근거와 완료 조건을 먼저 합의해 주세요.

  - type: textarea
    id: summary
    attributes:
      label: 작업 요약
      description: 무엇을 왜 만들거나 바꾸려는지 결과 중심으로 적어 주세요.
      placeholder: "예: 양손 관절을 작은 구체로 표시해 월드 좌표 변환을 눈으로 검증할 수 있게 한다."
    validations:
      required: true

  - type: textarea
    id: learner_outcome
    attributes:
      label: 학습자 결과
      description: 이 작업을 완료한 학습자가 무엇을 이해하거나 직접 할 수 있어야 하나요?
      placeholder: "학습자는 HandAnchor와 HandSkeleton을 사용해 양손 관절의 월드 위치를 계산할 수 있다."
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 이번 Issue에서 변경할 내용과 예상 파일을 적어 주세요.
      placeholder: |
        - ImmersiveView에 디버그 관절 Entity 추가
        - HandTrackingService에서 양손 Anchor 전달
        - DocC 03장과 코드 리스팅 갱신
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: 이번에 하지 않을 일
      description: 범위가 커지는 것을 막기 위해 제외할 내용을 적어 주세요.
      placeholder: "예: 이 Issue에서는 제스처 판정과 파티클 효과를 구현하지 않는다."
    validations:
      required: true

  - type: textarea
    id: sources
    attributes:
      label: 공식 근거와 참고 자료
      description: Apple Developer Documentation 등 우선 확인할 원문 링크를 적어 주세요. AI 답변만 근거로 사용하지 않습니다.
      placeholder: |
        - https://developer.apple.com/documentation/arkit/handtrackingprovider
        - 관련 WWDC 세션 또는 공식 샘플
    validations:
      required: true

  - type: dropdown
    id: verification_target
    attributes:
      label: 필요한 검증 환경
      options:
        - "Xcode 빌드 + Apple Vision Pro 실기기"
        - "Xcode 빌드 + visionOS Simulator"
        - "DocC 빌드만"
        - "GitHub Pages 배포 확인"
        - "문서 검토만"
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 완료 조건
      description: 리뷰어가 직접 확인할 수 있는 체크 항목으로 작성해 주세요.
      placeholder: |
        - [ ] 왼손과 오른손의 관절이 구분되어 표시된다.
        - [ ] 추적이 끊기면 관절 Entity가 숨겨진다.
        - [ ] Product > Build Documentation이 성공한다.
        - [ ] 미검증 항목이 문서에 명시되어 있다.
    validations:
      required: true

  - type: textarea
    id: ai_context
    attributes:
      label: AI 작업 맥락
      description: AI가 반드시 알아야 할 제약, 이미 검토한 제안, 확신이 낮은 부분을 적어 주세요.
      placeholder: "AGENTS.md를 먼저 읽고, 이 Issue 범위 밖의 리팩터링은 하지 않는다."

  - type: checkboxes
    id: agreement
    attributes:
      label: 작업 시작 전 확인
      options:
        - label: 기존 Issue와 중복되지 않는지 확인했습니다.
          required: true
        - label: 공식 자료로 확인하지 않은 API나 주장은 미검증으로 표시하겠습니다.
          required: true
        - label: 이 Issue의 담당자 한 명과 리뷰어 한 명을 정하겠습니다.
          required: true
